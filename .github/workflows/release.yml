name: Publish prepared main release

on:
  push:
    branches: [main]

permissions:
  contents: read


jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.classify.outputs.verdict }}
      version: ${{ steps.classify.outputs.version }}
      kind: ${{ steps.classify.outputs.kind }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the immutable merge evidence
        id: classify
        run: |
          set -euo pipefail
          result="$(python .github/scripts/release.py classify-merge --repo . --merge-sha "${GITHUB_SHA}")"
          verdict="$(jq -er '.verdict' <<<"${result}")"
          version="$(jq -r '.version // ""' <<<"${result}")"
          kind="$(jq -r '.kind // ""' <<<"${result}")"
          reason="$(jq -er '.reason' <<<"${result}")"
          {
            echo "verdict=${verdict}"
            echo "version=${version}"
            echo "kind=${kind}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"

          case "${verdict}" in
            PUBLISH)
              ;;
            NO_RELEASE)
              ;;
            ERROR)
              echo "Release classification failed: ${reason}" >&2
              exit 1
              ;;
            *)
              echo "Unknown release classification: ${verdict}" >&2
              exit 1
              ;;
          esac

  publish:
    needs: detect
    if: needs.detect.outputs.verdict == 'PUBLISH'
    concurrency:
      group: publish-release-${{ needs.detect.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/didimlog
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      TAG: v${{ needs.detect.outputs.version }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Test the exact release commit
        run: |
          uv sync --locked --python 3.13
          uv run --project . python -m unittest discover -s tests -v
      - name: Build wheel and source distribution once
        run: uv build --out-dir dist/packages
      - name: Verify tag, filenames, and checksums
        run: |
          set -euo pipefail
          wheel="didimlog-${VERSION}-py3-none-any.whl"
          sdist="didimlog-${VERSION}.tar.gz"
          test -f "dist/packages/${wheel}"
          test -f "dist/packages/${sdist}"
          test "$(find dist/packages -type f | wc -l)" -eq 2
          (
            cd dist/packages
            sha256sum "${wheel}" "${sdist}" > ../SHA256SUMS
            sha256sum --strict --check ../SHA256SUMS
          )
      - name: Check whether PyPI already has the exact files
        id: pypi
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/pypi.json"
          status="$(curl --silent --output "${response}" --write-out '%{http_code}' "https://pypi.org/pypi/didimlog/${VERSION}/json")"
          if test "${status}" = "404"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${status}" = "200"
          wheel="didimlog-${VERSION}-py3-none-any.whl"
          sdist="didimlog-${VERSION}.tar.gz"
          wheel_local="$(sha256sum "dist/packages/${wheel}" | cut -d ' ' -f 1)"
          sdist_local="$(sha256sum "dist/packages/${sdist}" | cut -d ' ' -f 1)"
          wheel_remote="$(jq -er --arg name "${wheel}" '.urls[] | select(.filename == $name) | .digests.sha256' "${response}")"
          sdist_remote="$(jq -er --arg name "${sdist}" '.urls[] | select(.filename == $name) | .digests.sha256' "${response}")"
          test "${wheel_local}" = "${wheel_remote}"
          test "${sdist_local}" = "${sdist_remote}"
          expected_files="$(printf '%s\n' "${wheel}" "${sdist}" | sort)"
          actual_files="$(jq -r '[.urls[].filename] | sort | .[]' "${response}")"
          test "${actual_files}" = "${expected_files}"
          echo "published=true" >> "${GITHUB_OUTPUT}"
      - name: Create or verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi
      - name: Create or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheel="didimlog-${VERSION}-py3-none-any.whl"
          sdist="didimlog-${VERSION}.tar.gz"
          expected_assets="$(printf '%s\n' "${wheel}" "${sdist}" SHA256SUMS | sort)"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${notes}"
          test -s "${notes}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
            draft="$(jq -r '.draft' <<<"${release}")"
            immutable="$(jq -r '.immutable' <<<"${release}")"
            test "${draft}" = "true" || test "${immutable}" = "true"
            draft_assets="$(jq -r '[.assets[].name] | sort | .[]' <<<"${release}")"
            test "${draft_assets}" = "${expected_assets}"
            assets="${RUNNER_TEMP}/release-assets"
            mkdir "${assets}"
            gh release download "${TAG}" --pattern "${wheel}" --pattern "${sdist}" --pattern SHA256SUMS --dir "${assets}"
            cmp "dist/packages/${wheel}" "${assets}/${wheel}"
            cmp "dist/packages/${sdist}" "${assets}/${sdist}"
            cmp "dist/SHA256SUMS" "${assets}/SHA256SUMS"
          else
            gh release create "${TAG}" \
              "dist/packages/${wheel}" \
              "dist/packages/${sdist}" \
              "dist/SHA256SUMS" \
              --draft \
              --verify-tag \
              --title "Didimlog ${VERSION}" \
              --notes-file "${notes}"
            draft=true
          fi
          if test "${draft}" = "true"; then
            gh release edit "${TAG}" --draft=false
          fi
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          immutable="$(jq -r '.immutable' <<<"${release}")"
          actual_assets="$(jq -r '[.assets[].name] | sort | .[]' <<<"${release}")"
          test "${immutable}" = "true"
          test "${actual_assets}" = "${expected_assets}"
      - name: Publish with PyPI Trusted Publishing
        if: steps.pypi.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages/
          attestations: true

  reconcile-open-prs:
    needs: [detect, publish]
    if: >-
      ${{
        always() &&
        (needs.detect.result == 'success' || needs.detect.result == 'failure') &&
        (
          needs.publish.result == 'success' ||
          needs.publish.result == 'skipped' ||
          needs.publish.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Reconcile every eligible open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          repository_id="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .id)"

          pull_requests="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          pr_numbers="${RUNNER_TEMP}/release-pr-numbers"
          jq -r --argjson repo_id "${repository_id}" '

            .[][] |
            select(
              .state == "open" and
              .base.ref == "main" and
              .base.repo.id == $repo_id and
              .head.repo.id == $repo_id and
              (
                .head.ref == "develop" or
                (.head.ref | startswith("hotfix/"))
              )
            ) |
            .number
          ' <<<"${pull_requests}" > "${pr_numbers}"
          while IFS= read -r pr_number; do
            gh workflow run prepare-release.yml --repo "${GITHUB_REPOSITORY}" \
              --ref "${default_branch}" \
              -f "pr_number=${pr_number}"
          done < "${pr_numbers}"
