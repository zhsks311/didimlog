name: Publish verified release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/didimlog
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require an immutable published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          immutable="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.immutable')"
          test "${immutable}" = "true"
      - name: Download the preserved package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir packages verify
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern 'didimlog-*.whl' --pattern 'didimlog-*.tar.gz' --dir packages
          gh release download "${TAG}" --repo "${REPOSITORY}" --pattern 'SHA256SUMS' --dir verify
      - name: Verify tag, filenames, and checksums
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          wheel_filename="didimlog-${version}-py3-none-any.whl"
          sdist_filename="didimlog-${version}.tar.gz"
          test -f "packages/${wheel_filename}"
          test -f "packages/${sdist_filename}"
          test "$(find packages -type f | wc -l)" -eq 2
          expected_filenames="$(printf '%s\n' "${wheel_filename}" "${sdist_filename}" | sort)"
          manifest_filenames="$(awk 'length($1) == 64 && $1 ~ /^[[:xdigit:]]+$/ && NF == 2 && (substr($0, 65, 2) == "  " || substr($0, 65, 2) == " *") { print substr($0, 67); next } { exit 1 }' verify/SHA256SUMS | sort)"
          test "${manifest_filenames}" = "${expected_filenames}"
          cd packages
          sha256sum --strict --check ../verify/SHA256SUMS
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/
          attestations: true
