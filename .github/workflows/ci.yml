name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run canonical suite
        run: uv run --project . python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Install and exercise the wheel
        run: |
          uv venv .wheel-venv --python ${{ matrix.python-version }}
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/didim --version
      - name: Publish exact-head required status
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ matrix.os }} / Python ${{ matrix.python-version }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="${STATUS_CONTEXT}" \
            -f description="Exact-head CI passed" \
            -f target_url="${TARGET_URL}"
